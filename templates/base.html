<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Detour is a self-healing travel planner.">
    <title>{% block title %}Detour{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('pages.index') }}" aria-label="Detour home">Detour</a>
      <span class="tagline">Plans change. Yours can too.</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
